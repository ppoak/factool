[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factool"
version = "0.3.2"
description = "Factor tool is a quant framework for factor research."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "ppoak", email = "ppoak@foxmail.com" }
]
keywords = ["quant", "factor analysis", "finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.2",
    "typing>=3.10.0.0",
    "duckdb>=1.3.2",
    "markdown>=3.9",
    "joblib>=1.5.2",
    "numpy>=2.2",
    "parquool>=0.0.3",
    "matplotlib>=3.9",
    "openpyxl>=3.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.urls]
Homepage = "https://github.com/ppoak/factorlab"

[tool.setuptools.packages]
find = { include = ["factool"] }
